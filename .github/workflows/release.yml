name: Release FlowSnap

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0-beta.1)'
        required: false
        default: 'v1.0.0-beta.1'

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Package Universal CLI + Web Studio Bundle
  # --------------------------------------------------------------------------
  release-cli:
    name: Package Universal CLI & Agent Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Run test suite
        run: npm run test:all

      - name: Build Web Studio (UI)
        run: npm run ui:build

      - name: Determine version tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Package Distribution Archives
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          DIST_DIR="flowsnap-${TAG}"
          mkdir -p "$DIST_DIR"

          # Copy runtime files and built assets
          cp -r bin src scripts .agents skills package.json package-lock.json README.md "$DIST_DIR/"
          mkdir -p "$DIST_DIR/ui"
          cp -r ui/dist "$DIST_DIR/ui/"

          # Make scripts executable
          chmod +x "$DIST_DIR/bin/"* "$DIST_DIR/scripts/"*.sh

          # Create Tarball and Zip
          tar -czf "${DIST_DIR}.tar.gz" "$DIST_DIR"
          zip -rq "${DIST_DIR}.zip" "$DIST_DIR"

          # Generate Checksums
          sha256sum "${DIST_DIR}.tar.gz" "${DIST_DIR}.zip" > SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: FlowSnap ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.vars.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            flowsnap-${{ steps.vars.outputs.tag }}.tar.gz
            flowsnap-${{ steps.vars.outputs.tag }}.zip
            SHA256SUMS.txt
          body: |
            ## 📸 FlowSnap ${{ steps.vars.outputs.tag }} — Autonomous UI Action Recorder & Intelligent SOP Synthesizer

            ### 💻 Download Aplikasi Desktop Native:
            - **Windows**: `flowsnap_${{ steps.vars.outputs.tag }}_x64-setup.exe` / `.msi`
            - **Linux**: `flowsnap_${{ steps.vars.outputs.tag }}_amd64.deb` / `.AppImage`
            - **macOS**: `flowsnap_${{ steps.vars.outputs.tag }}_universal.dmg`

            ---

            ### ✨ Fitur Unggulan
            - **Dual-Capture Technology**: Tangkapan layar otomatis sebelum (*action*) dan sesudah (*result*) setiap aksi klik / submit.
            - **Privacy First & Auto-Redaction**: Penyamaran otomatis elemen sensitif (*passwords, tokens, PINs, personal info*) menggunakan DOM blurring dan metadata sanitization.
            - **Ergonomic Studio (Dark & Light Mode)**: Dashboard web interaktif dengan live telemetry capture stream, viewer SOP mandiri, dan image lightbox zoom.
            - **🤖 One-Command AI Agent Setup**: Otomatis mengonfigurasi **MCP Server** dan **Skill** ke dalam coding agent Anda (**Antigravity**, **Claude Desktop**, **Cursor**, **Windsurf**).

            ---

            ### 🚀 Panduan Instalasi Cepat (CLI & Server)

            ```bash
            # Download & Extract
            tar -xzf flowsnap-${{ steps.vars.outputs.tag }}.tar.gz
            cd flowsnap-${{ steps.vars.outputs.tag }}

            # Jalankan Installer (Otomatis Pasang CLI, MCP Server, & Skill)
            ./scripts/install.sh

            # Jalankan Studio
            flowsnap start
            ```

  # --------------------------------------------------------------------------
  # 2. Build Native Desktop Applications (.exe, .deb, .AppImage, .dmg)
  # --------------------------------------------------------------------------
  release-desktop:
    name: Build Desktop Installer (${{ matrix.platform }})
    needs: release-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Build Web Studio (UI)
        run: npm run ui:build

      - name: Determine version tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build Tauri Desktop Installers (.deb, .AppImage, .exe, .dmg)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.vars.outputs.tag }}
          releaseName: 'FlowSnap ${{ steps.vars.outputs.tag }}'
          releaseDraft: false
          prerelease: ${{ contains(steps.vars.outputs.tag, '-') }}
          args: ${{ matrix.args }}
